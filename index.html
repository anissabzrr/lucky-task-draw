    body {

    /* =========================
       MAIN WINDOW
       ========================= */

}

      letter-spacing: 0.5px;

    }


    /* =========================
       STATES
       ========================= */

    .hidden {
      display: none !important;
    }


    .winner {
      animation: winnerPop 0.4s ease;
    }


    @keyframes winnerPop {
      0% {
        transform: scale(0.96);
        opacity: 0.3;
      }

      70% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }

<body>

  <div class="lucky-window">

    <div class="title-bar" id="dragHandle">

      <div class="title-text">
        ✿ lucky task draw
      </div>

      <div class="window-buttons">
        <button class="window-button" id="minimizeButton" type="button" aria-label="Minimize">_</button>
        <button class="window-button" id="closeButton" type="button" aria-label="Close">×</button>
      </div>

    </div>


    <div class="window-body">

      <div class="mini-decoration">
        ♡ ✦ ♡
      </div>

      <h1>LUCKY TASK DRAW</h1>

      <div class="subtitle">
        one click. no take-backs.
      </div>


      <div class="status-card">

        <div class="status-label">
          ✦ STATUS
        </div>

        <div id="statusText">
          checking today's draw...
        </div>

      </div>


      <div class="draw-area">

        <div
          class="feeling-lucky"
          id="feelingLucky"
        >
          feeling lucky?
        </div>


        <button
          id="drawButton"
          class="hidden"
          type="button"
        >
          ✦ DRAW! ✦
        </button>


        <div
          class="no-rerolls"
          id="noRerolls"
        >
          no rerolls, no exceptions
        </div>

      </div>


      <div class="divider">
        <span class="divider-symbol">
          ♡
        </span>
      </div>


      <div class="task-card">

        <div class="task-card-title">
          ★ TODAY'S TASK ★
        </div>


        <div
          class="task-screen"
          id="taskScreen"
        >

          <div
            class="screen-label"
            id="screenLabel"
          >
            DAILY TASK
          </div>


          <a
  id="taskText"
  href="#"
  target="_blank"
  rel="noopener noreferrer"
>
  checking...
</a>


          <div id="dateText"></div>

        </div>

      </div>


      <div class="note">
        let the universe pick!<br>
        you just do the work.
      </div>


      <div class="footer">
        <span class="footer-heart">♥</span>
        today is yours to make productive
        <span class="footer-heart">♥</span>
      </div>

    </div>

  </div>

  <button
    id="reopenButton"
    class="reopen-button hidden"
    type="button"
    aria-label="Reopen Lucky Task Draw"
  >
    ✿
  </button>


  <script>

    const WORKER_URL =
      "https://lucky-task-draw.acmelobezerra.workers.dev";


    const drawButton =
      document.getElementById("drawButton");

    const taskText =
      document.getElementById("taskText");

    const dateText =
      document.getElementById("dateText");

    const statusText =
      document.getElementById("statusText");

    const screenLabel =
      document.getElementById("screenLabel");

    const taskScreen =
      document.getElementById("taskScreen");

    const feelingLucky =
      document.getElementById("feelingLucky");

    const noRerolls =
      document.getElementById("noRerolls");

    const luckyWindow =
      document.querySelector(".lucky-window");

    const dragHandle =
      document.getElementById("dragHandle");

    const minimizeButton =
      document.getElementById("minimizeButton");

    const closeButton =
      document.getElementById("closeButton");

    const reopenButton =
      document.getElementById("reopenButton");


    /* =========================
       CHECK TODAY
       ========================= */

    async function checkToday() {

      try {

        const response =
          await fetch(WORKER_URL);

        const data =
          await response.json();


        if (data.status === "ready") {

          showReadyState(data);

        }

        else if (
          data.status === "already_drawn"
        ) {

          showWinner(data);

        }

        else {

          showError(
            data.message ||
            "Something unexpected happened."
          );

        }

      }

      catch (error) {

        showError(
          "Couldn't connect to Lucky Task Draw."
        );

        console.error(error);

      }

    }


    /* =========================
       DRAW
       ========================= */

    async function drawTask() {

      drawButton.disabled = true;

      drawButton.textContent =
        "✦ DRAWING... ✦";

      taskText.textContent =
        "consulting the universe...";

      screenLabel.textContent =
        "PLEASE WAIT";

      statusText.textContent =
        "fate is choosing...";


      try {

        const response =
          await fetch(
            WORKER_URL + "/draw",
            {
              method: "POST"
            }
          );


        const data =
          await response.json();


        if (
          data.status === "drawn" ||
          data.status === "already_drawn"
        ) {

          showWinner(data);

        }

        else if (
          data.status === "empty"
        ) {

          taskText.textContent =
            "no eligible tasks";

          screenLabel.textContent =
            "NOTHING TO DRAW";

          statusText.textContent =
            data.message;

          drawButton.disabled = false;

          drawButton.textContent =
            "✦ DRAW! ✦";

        }

        else {

          showError(
            data.message ||
            "The draw failed."
          );

        }

      }

      catch (error) {

        showError(
          "Couldn't complete the draw."
        );

        console.error(error);

      }

    }


    /* =========================
       READY STATE
       ========================= */

    function showReadyState(data) {

      screenLabel.textContent =
        "WAITING FOR TODAY'S DRAW";

      taskText.innerHTML =
        "no task drawn yet";

      taskText.removeAttribute("href");
      taskText.style.cursor = "default";

      dateText.textContent =
        formatDate(data.date);

      statusText.textContent =
        "ready when you are.";

      feelingLucky.classList.remove(
        "hidden"
      );

      noRerolls.classList.remove(
        "hidden"
      );

      drawButton.classList.remove(
        "hidden"
      );

      drawButton.disabled = false;

      drawButton.textContent =
        "✦ DRAW! ✦";

    }


    /* =========================
       WINNER STATE
       ========================= */

    function showWinner(data) {

      screenLabel.textContent =
        "THE DRAW HAS SPOKEN";

      taskText.textContent =
        data.task;

      taskText.href = data.taskUrl;
      taskText.style.cursor = "pointer";

      dateText.textContent =
        "drawn on " +
        formatDate(data.date);

      statusText.textContent =
        "today's task has been chosen.";

      drawButton.classList.add(
        "hidden"
      );

      feelingLucky.classList.add(
        "hidden"
      );

      noRerolls.classList.add(
        "hidden"
      );


      taskScreen.classList.remove(
        "winner"
      );

      void taskScreen.offsetWidth;

      taskScreen.classList.add(
        "winner"
      );

    }


    /* =========================
       ERROR
       ========================= */

    function showError(message) {

      screenLabel.textContent =
        "ERROR";

      taskText.textContent =
        "oops!";

      taskText.removeAttribute("href");
      taskText.style.cursor = "default";

      dateText.textContent = "";

      statusText.textContent =
        message;

      drawButton.classList.add(
        "hidden"
      );

    }


    /* =========================
       DATE
       ========================= */

    function formatDate(dateString) {

      if (!dateString) {
        return "";
      }

      const [
        year,
        month,
        day
      ] = dateString.split("-");


      const date =
        new Date(
          Number(year),
          Number(month) - 1,
          Number(day)
        );


      return date.toLocaleDateString(
        "en-US",
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );

    }



    /* =========================
       WINDOW CONTROLS
       ========================= */

    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function prepareWindowForDragging() {
      const rect = luckyWindow.getBoundingClientRect();

      luckyWindow.style.left = rect.left + "px";
      luckyWindow.style.top = rect.top + "px";
      luckyWindow.style.transform = "none";
    }


    function startDrag(event) {

      if (event.target.closest(".window-button")) {
        return;
      }

      prepareWindowForDragging();

      const rect = luckyWindow.getBoundingClientRect();

      isDragging = true;

      dragOffsetX =
        event.clientX - rect.left;

      dragOffsetY =
        event.clientY - rect.top;

      dragHandle.setPointerCapture(
        event.pointerId
      );

      event.preventDefault();
    }


    function dragWindow(event) {

      if (!isDragging) {
        return;
      }

      const maxLeft =
        Math.max(
          0,
          window.innerWidth -
          luckyWindow.offsetWidth
        );

      const maxTop =
        Math.max(
          0,
          window.innerHeight -
          luckyWindow.offsetHeight
        );

      let newLeft =
        event.clientX - dragOffsetX;

      let newTop =
        event.clientY - dragOffsetY;

      newLeft =
        Math.min(
          Math.max(0, newLeft),
          maxLeft
        );

      newTop =
        Math.min(
          Math.max(0, newTop),
          maxTop
        );

      luckyWindow.style.left =
        newLeft + "px";

      luckyWindow.style.top =
        newTop + "px";
    }


    function stopDrag(event) {

      if (!isDragging) {
        return;
      }

      isDragging = false;

      if (
        dragHandle.hasPointerCapture(
          event.pointerId
        )
      ) {
        dragHandle.releasePointerCapture(
          event.pointerId
        );
      }
    }


    function toggleMinimize() {

      const minimized =
        luckyWindow.classList.toggle(
          "minimized"
        );

      minimizeButton.textContent =
        minimized ? "□" : "_";
    }


    function closeWindow() {

      luckyWindow.classList.add(
        "hidden"
      );

      reopenButton.classList.remove(
        "hidden"
      );
    }


    function reopenWindow() {

      luckyWindow.classList.remove(
        "hidden"
      );

      reopenButton.classList.add(
        "hidden"
      );
    }


    function keepWindowOnScreen() {

      if (
        luckyWindow.classList.contains(
          "hidden"
        )
      ) {
        return;
      }

      const rect =
        luckyWindow.getBoundingClientRect();

      if (
        luckyWindow.style.transform !==
        "none"
      ) {
        return;
      }

      const maxLeft =
        Math.max(
          0,
          window.innerWidth -
          luckyWindow.offsetWidth
        );

      const maxTop =
        Math.max(
          0,
          window.innerHeight -
          luckyWindow.offsetHeight
        );

      luckyWindow.style.left =
        Math.min(
          Math.max(0, rect.left),
          maxLeft
        ) + "px";

      luckyWindow.style.top =
        Math.min(
          Math.max(0, rect.top),
          maxTop
        ) + "px";
    }


    /* =========================
       EVENTS
       ========================= */

    drawButton.addEventListener(
      "click",
      drawTask
    );

    dragHandle.addEventListener(
      "pointerdown",
      startDrag
    );

    dragHandle.addEventListener(
      "pointermove",
      dragWindow
    );

    dragHandle.addEventListener(
      "pointerup",
      stopDrag
    );

    dragHandle.addEventListener(
      "pointercancel",
      stopDrag
    );

    minimizeButton.addEventListener(
      "click",
      toggleMinimize
    );

    closeButton.addEventListener(
      "click",
      closeWindow
    );

    reopenButton.addEventListener(
      "click",
      reopenWindow
    );

    window.addEventListener(
      "resize",
      keepWindowOnScreen
    );


    checkToday();

  </script>

</body>
</html>
