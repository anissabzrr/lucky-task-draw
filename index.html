  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --brown-dark: #684c3b;
      --brown: #8b6a55;
      --brown-light: #b89b85;

      --beige: #eee3d9;
      --cream: #fffaf3;
      --paper: #fbf5ed;

      --pink: #e8bfc0;
      --pink-light: #f4dddd;
      --pink-pale: #faeeee;

      --line: #d8c7b9;
      --text-soft: #9b7e6c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: var(--brown-dark);
      font-family: Georgia, "Times New Roman", serif;
      background-color: #e9ddcf;
      background-image: url("https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjicyTdWfkg8QqoKsFbmZqoY2UQrBYczeojHgKTHmKK7_-_Lsql7W6Fd13pbE61dbCo0XYH2pS6YbjiqI38AUxxwrz30DVrOaNLNPnMDuLj8-uz_O9OFnRTKMVe_HxRH0cvp64mofoo3B1SQGegsQpskvoC4UVTfgRKxCxzI46A9t73ZrwbgKKjFFO0ORE/s1600/22cde72e540d83ebb2c128752215247f.jpg");
      background-repeat: repeat;
      background-position: top left;
      background-size: auto 640px;
    }


    /* =========================
       MAIN WINDOW
       ========================= */

    .lucky-window {
      width: min(440px, 100%);
      overflow: hidden;
      border: 1px solid #b99e89;
      border-radius: 8px;
      background: var(--paper);
      box-shadow:
        0 8px 25px rgba(91, 65, 48, 0.18),
        4px 4px 0 rgba(139, 106, 85, 0.08);
    }


    /* =========================
       TITLE BAR
       ========================= */

    .title-bar {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 8px 14px;
      color: var(--brown-dark);
      background:
        linear-gradient(
          to bottom,
          #efd4d3,
          #e5bfbd
        );
      border-bottom: 1px solid #b99682;
    }

    .title-text {
      font-family: "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }


    /* =========================
       BODY
       ========================= */

    .window-body {
      padding: 29px 28px 26px;
      text-align: center;
      background:
        linear-gradient(
          rgba(255,250,244,0.91),
          rgba(255,250,244,0.91)
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0,
          transparent 25px,
          rgba(148,113,88,0.04) 25px,
          rgba(148,113,88,0.04) 26px
        );
    }


    .mini-decoration {
      margin-bottom: 7px;
      color: #c89294;
      font-size: 17px;
      letter-spacing: 4px;
    }


    h1 {
      margin: 0;
      color: var(--brown-dark);
      font-size: 25px;
      font-weight: normal;
      letter-spacing: 3px;
      font-weight: 700;
    }


    .subtitle {
      margin: 7px 0 23px;
      color: #b77e7f;
      font-size: 13px;
      font-style: italic;
      letter-spacing: 1px;
    }


    /* =========================
       STATUS CARD
       ========================= */

    .status-card {
      position: relative;
      margin-bottom: 24px;
      padding: 15px 17px;
      text-align: left;
      background: #f4eadf;
      border: 1px solid #cfb69e;
      border-radius: 5px;
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.32);
    }


    .status-label {
      margin-bottom: 7px;
      color: #8b6651;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
    }


    #statusText {
      color: #8e7462;
      font-family: "Courier New", monospace;
      font-size: 15px;
      line-height: 1.5;
    }


    /* =========================
       DRAW AREA
       ========================= */

    .draw-area {
      margin: 2px 0 25px;
    }


    .feeling-lucky {
      margin-bottom: 12px;
      color: var(--brown-dark);
      font-size: 17px;
      font-style: italic;
    }


    #drawButton {
      min-width: 160px;
      padding: 12px 24px;
      cursor: pointer;
      border: 1px solid #9d705e;
      border-radius: 4px;

      background:
        linear-gradient(
          to bottom,
          #efd1d0,
          #dfa9aa
        );

      color: #654737;

      font-family: "Courier New", monospace;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;

      box-shadow:
        inset 0 0 0 3px #f7e3e1,
        3px 3px 0 #cdb7a6;

      transition:
        transform 0.08s ease,
        background 0.15s ease;
    }


    #drawButton:hover {
      background:
        linear-gradient(
          to bottom,
          #f2d8d7,
          #e4b3b3
        );

      transform: translateY(-1px);
    }


    #drawButton:active {
      transform: translate(2px, 2px);

      box-shadow:
        inset 0 0 0 3px #f7e3e1,
        1px 1px 0 #cdb7a6;
    }


    #drawButton:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
    }


    .no-rerolls {
      margin-top: 10px;
      color: #b28778;
      font-family: "Courier New", monospace;
      font-size: 9px;
      letter-spacing: 1px;
    }


    /* =========================
       DIVIDER
       ========================= */

    .divider {
      position: relative;
      height: 20px;
      margin: 3px 0 14px;
    }


    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;

      background:
        repeating-linear-gradient(
          to right,
          #c8a994 0,
          #c8a994 3px,
          transparent 3px,
          transparent 6px
        );
    }


    .divider-symbol {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 0 10px;
      background: var(--paper);
      color: #d0999b;
      font-size: 16px;
    }


    /* =========================
       TASK CARD
       ========================= */

    .task-card {
      padding: 10px;
      background: #eee0d2;
      border: 1px solid #b99d85;
      border-radius: 6px;
      box-shadow:
        inset 0 0 0 3px rgba(255,255,255,0.35);
    }


    .task-card-title {
      padding: 3px 0 10px;
      color: #765744;
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
    }


    .task-screen {
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 19px 20px;
      background: #fff9f3;
      border: 1px dashed #d1aaa6;
      border-radius: 4px;
    }


    .screen-label {
      margin-bottom: 10px;
      color: #bd8586;
      font-family: "Courier New", monospace;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 2px;
    }


    #taskText {
      color: #674c3c;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      text-decoration: none;
      display: inline-block;
    }

    #taskText:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}

    #dateText {
      margin-top: 13px;
      color: #a48672;
      font-family: "Courier New", monospace;
      font-size: 9px;
    }


    /* =========================
       LITTLE NOTE
       ========================= */

    .note {
      margin-top: 19px;
      padding: 11px 15px;
      color: #765744;
      font-family: "Courier New", monospace;
      font-size: 11px;
      line-height: 1.55;
      background-color: #f5dddd;
      background-image:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 19px,
          rgba(168,113,112,0.16) 19px,
          rgba(168,113,112,0.16) 20px
        );
      border: 1px solid #e5c5c3;
      border-radius: 3px;
      transform: rotate(-0.4deg);
      box-shadow:
        2px 2px 0 rgba(112,82,62,0.06);
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {
      margin-top: 18px;
      color: #a38069;
      font-size: 10px;
      font-style: italic;
      letter-spacing: 0.5px;
    }


    .footer-heart {
      color: #ca9191;
    }


    /* =========================
       STATES
       ========================= */

    .hidden {
      display: none !important;
    }


    .winner {
      animation: winnerPop 0.4s ease;
    }


    @keyframes winnerPop {
      0% {
        transform: scale(0.96);
        opacity: 0.3;
      }

      70% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }


    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .window-body {
        padding: 24px 19px 22px;
      }

      h1 {
        font-size: 21px;
        letter-spacing: 2px;
      }
    }

/* =====================================
   CATEGORY DRAW CONTROLS
   ===================================== */

.category-picker {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin: 0 0 16px;
}

.category-button {
  min-width: 0;
  padding: 8px 6px;
  border: 1px solid #6b4a38;
  border-radius: 4px;
  background: linear-gradient(to bottom, #d6b79c, #bc9577);
  color: #4b3126;
  font-family: "Special Elite", "Courier New", monospace;
  font-size: 10px;
  line-height: 1.25;
  cursor: pointer;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14);
  transition: transform 0.08s ease, background 0.15s ease, color 0.15s ease;
}

.category-button:hover {
  background: linear-gradient(to bottom, #e0c5ae, #c9a184);
  transform: translateY(-1px);
}

.category-button.active {
  background: linear-gradient(to bottom, #e5b8ba, #c9878b);
  color: #50342f;
  border-color: #714b48;
  box-shadow: inset 0 0 0 2px #f0d0d1;
}

.category-button.drawn::after {
  content: " ✓";
  color: #fff5e9;
}

.category-button.empty::after {
  content: " —";
  opacity: 0.75;
}

.category-label {
  margin-bottom: 7px;
  color: #4f3427;
  font-family: "Special Elite", "Courier New", monospace;
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

@media (max-width: 500px) {
  .category-picker {
    grid-template-columns: repeat(2, 1fr);
  }
}

}

}

/* =====================================
   DRAGGABLE WINDOW + WINDOW CONTROLS
   ===================================== */

.lucky-window {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

.title-bar {
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.title-bar:active {
  cursor: grabbing;
}

.window-buttons {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.window-button {
  width: 22px;
  height: 22px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid #38261e;
  border-radius: 3px;

  background:
    linear-gradient(
      to bottom,
      #ead7c5,
      #cbaa8e
    );

  color: #493126;

  font-family: "Special Elite", "Courier New", monospace;
  font-size: 13px;
  line-height: 1;

  cursor: pointer;

  box-shadow:
    inset 1px 1px 0 rgba(255,255,255,0.55);
}

.window-button:hover {
  background:
    linear-gradient(
      to bottom,
      #f1e2d4,
      #d8bda6
    );
}

.window-button:active {
  transform: translate(1px, 1px);
}

.lucky-window.minimized .window-body {
  display: none;
}

.lucky-window.minimized {
  width: min(300px, calc(100vw - 30px));
}

.reopen-button {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 20;

  width: 42px;
  height: 42px;

  border: 1px solid #38261e;
  border-radius: 50%;

  background:
    linear-gradient(
      to bottom,
      #e5b8ba,
      #c9878b
    );

  color: #50342f;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;

  cursor: pointer;

  box-shadow:
    inset 0 0 0 3px #f0d0d1,
    3px 3px 0 #654737;
}

.reopen-button:hover {
  background:
    linear-gradient(
      to bottom,
      #edc5c6,
      #d29497
    );
}

@media (max-width: 500px) {
  .lucky-window {
    max-width: calc(100vw - 30px);
  }
}

        <button class="category-button active" type="button" data-category="writing">✏️ Writing</button>
        <button class="category-button" type="button" data-category="learning">📕 Learning</button>
        <button class="category-button" type="button" data-category="organising">📋 Organising</button>
        <button class="category-button" type="button" data-category="designing">🎨 Designing</button>
        <button class="category-button" type="button" data-category="adulting">🪴 Adulting</button>
        <button class="category-button" type="button" data-category="miscellaneous">📦 Misc.</button>
      </div>


      <div class="status-card">

        <div class="status-label">
          ✦ STATUS
        </div>

        <div id="statusText">
          checking today's draw...
        </div>

      </div>


      <div class="draw-area">

        <div
          class="feeling-lucky"
          id="feelingLucky"
        >
          feeling lucky?
        </div>


        <button
          id="drawButton"
          class="hidden"
          type="button"
        >
          ✦ DRAW! ✦
        </button>


        <div
          class="no-rerolls"
          id="noRerolls"
        >
          no rerolls, no exceptions
        </div>

      </div>


      <div class="divider">
        <span class="divider-symbol">
          ♡
        </span>
      </div>


      <div class="task-card">

        <div class="task-card-title">
          ★ TODAY'S TASK ★
        </div>


        <div
          class="task-screen"
          id="taskScreen"
        >

          <div
            class="screen-label"
            id="screenLabel"
          >
            DAILY TASK
          </div>


          <a
  id="taskText"
  href="#"
  target="_blank"
  rel="noopener noreferrer"
>
  checking...
</a>


          <div id="dateText"></div>

        </div>

      </div>


      <div class="note">
        let the universe pick!<br>
        you just do the work.
      </div>


      <div class="footer">
        <span class="footer-heart">♥</span>
        today is yours to make productive
        <span class="footer-heart">♥</span>
      </div>

    </div>

  </div>

  <button
    id="reopenButton"
    class="reopen-button hidden"
    type="button"
    aria-label="Reopen Lucky Task Draw"
  >
    ✿
  </button>


  <script>

    const WORKER_URL =
      "https://lucky-task-draw.acmelobezerra.workers.dev";

    const CATEGORIES = {
      writing: "Writing",
      learning: "Learning",
      organising: "Organising",
      designing: "Designing",
      adulting: "Adulting",
      miscellaneous: "Miscellaneous"
    };

    let selectedCategory = "writing";
    const categoryStates = {};

    const drawButton = document.getElementById("drawButton");
    const taskText = document.getElementById("taskText");
    const dateText = document.getElementById("dateText");
    const statusText = document.getElementById("statusText");
    const screenLabel = document.getElementById("screenLabel");
    const taskScreen = document.getElementById("taskScreen");
    const feelingLucky = document.getElementById("feelingLucky");
    const noRerolls = document.getElementById("noRerolls");
    const categoryPicker = document.getElementById("categoryPicker");
    const categoryButtons = [...document.querySelectorAll(".category-button")];

    const luckyWindow = document.querySelector(".lucky-window");
    const dragHandle = document.getElementById("dragHandle");
    const minimizeButton = document.getElementById("minimizeButton");
    const closeButton = document.getElementById("closeButton");
    const reopenButton = document.getElementById("reopenButton");

    function getCategoryLabel(category) {
      return CATEGORIES[category] || category;
    }

    function setSelectedCategory(category) {
      selectedCategory = category;

      categoryButtons.forEach(button => {
        button.classList.toggle(
          "active",
          button.dataset.category === category
        );
      });
    }

    function updateCategoryButton(category, status) {
      const button = categoryButtons.find(
        item => item.dataset.category === category
      );

      if (!button) return;

      button.classList.remove("drawn", "empty");

      if (status === "drawn" || status === "already_drawn") {
        button.classList.add("drawn");
      } else if (status === "empty") {
        button.classList.add("empty");
      }
    }

    async function checkCategory(category, showOnScreen = true) {
      if (showOnScreen) {
        showLoadingState(category);
      }

      try {
        const response = await fetch(
          `${WORKER_URL}/?category=${encodeURIComponent(category)}`
        );

        const data = await response.json();
        categoryStates[category] = data;
        updateCategoryButton(category, data.status);

        if (showOnScreen && selectedCategory === category) {
          if (data.status === "ready") {
            showReadyState(data);
          } else if (data.status === "already_drawn") {
            showWinner(data);
          } else if (data.status === "empty") {
            showEmptyState(data);
          } else {
            showError(data.message || "Something unexpected happened.");
          }
        }

        return data;

      } catch (error) {
        if (showOnScreen && selectedCategory === category) {
          showError("Couldn't connect to Lucky Task Draw.");
        }
        console.error(error);
        return null;
      }
    }

    async function checkAllCategories() {
      await Promise.all(
        Object.keys(CATEGORIES).map(
          category => checkCategory(
            category,
            category === selectedCategory
          )
        )
      );
    }

    async function drawTask() {
      const categoryAtClick = selectedCategory;

      drawButton.disabled = true;
      drawButton.textContent = "✦ DRAWING... ✦";

      taskText.textContent = "consulting the universe...";
      taskText.removeAttribute("href");
      taskText.style.cursor = "default";

      screenLabel.textContent = "PLEASE WAIT";
      statusText.textContent =
        `${getCategoryLabel(categoryAtClick)} fate is choosing...`;

      try {
        const response = await fetch(
          WORKER_URL + "/draw",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              category: categoryAtClick
            })
          }
        );

        const data = await response.json();

        categoryStates[categoryAtClick] = data;
        updateCategoryButton(categoryAtClick, data.status);

        if (selectedCategory !== categoryAtClick) {
          return;
        }

        if (data.status === "drawn" || data.status === "already_drawn") {
          showWinner(data);
        } else if (data.status === "empty") {
          showEmptyState(data);
        } else {
          showError(data.message || "The draw failed.");
        }

      } catch (error) {
        if (selectedCategory === categoryAtClick) {
          showError("Couldn't complete the draw.");
        }
        console.error(error);
      }
    }

    function showLoadingState(category) {
      const label = getCategoryLabel(category);

      screenLabel.textContent = `CHECKING ${label.toUpperCase()}...`;
      taskText.textContent = "checking...";
      taskText.removeAttribute("href");
      taskText.style.cursor = "default";

      dateText.textContent = "";
      statusText.textContent =
        `checking today's ${label.toLowerCase()} draw...`;

      feelingLucky.classList.add("hidden");
      noRerolls.classList.add("hidden");
      drawButton.classList.add("hidden");
    }

    function showReadyState(data) {
      const label =
        data.categoryLabel ||
        getCategoryLabel(data.category || selectedCategory);

      screenLabel.textContent =
        `WAITING FOR ${label.toUpperCase()} DRAW`;

      taskText.textContent = "no task drawn yet";
      taskText.removeAttribute("href");
      taskText.style.cursor = "default";

      dateText.textContent = formatDate(data.date);
      statusText.textContent = `${label}: ready when you are.`;

      feelingLucky.textContent =
        `feeling lucky, ${label.toLowerCase()} edition?`;

      feelingLucky.classList.remove("hidden");
      noRerolls.classList.remove("hidden");
      drawButton.classList.remove("hidden");

      drawButton.disabled = false;
      drawButton.textContent = "✦ DRAW! ✦";
    }

    function showWinner(data) {
      const label =
        data.categoryLabel ||
        getCategoryLabel(data.category || selectedCategory);

      screenLabel.textContent =
        `${label.toUpperCase()} DRAW HAS SPOKEN`;

      taskText.textContent = data.task;

      if (data.taskUrl) {
        taskText.href = data.taskUrl;
        taskText.style.cursor = "pointer";
      } else {
        taskText.removeAttribute("href");
        taskText.style.cursor = "default";
      }

      dateText.textContent =
        "drawn on " + formatDate(data.date);

      statusText.textContent =
        `today's ${label.toLowerCase()} task has been chosen.`;

      drawButton.classList.add("hidden");
      feelingLucky.classList.add("hidden");
      noRerolls.classList.add("hidden");

      taskScreen.classList.remove("winner");
      void taskScreen.offsetWidth;
      taskScreen.classList.add("winner");
    }

    function showEmptyState(data) {
      const label =
        data.categoryLabel ||
        getCategoryLabel(data.category || selectedCategory);

      screenLabel.textContent =
        `NO ${label.toUpperCase()} TASKS`;

      taskText.textContent =
        "nothing eligible to draw";

      taskText.removeAttribute("href");
      taskText.style.cursor = "default";

      dateText.textContent = formatDate(data.date);
      statusText.textContent =
        data.message ||
        `No eligible ${label.toLowerCase()} tasks found.`;

      drawButton.classList.add("hidden");
      feelingLucky.classList.add("hidden");
      noRerolls.classList.add("hidden");
    }

    function showError(message) {
      screenLabel.textContent = "ERROR";
      taskText.textContent = "oops!";
      taskText.removeAttribute("href");
      taskText.style.cursor = "default";
      dateText.textContent = "";
      statusText.textContent = message;

      drawButton.classList.add("hidden");
      feelingLucky.classList.add("hidden");
      noRerolls.classList.add("hidden");
    }

    function formatDate(dateString) {
      if (!dateString) return "";

      const [year, month, day] = dateString.split("-");

      const date = new Date(
        Number(year),
        Number(month) - 1,
        Number(day)
      );

      return date.toLocaleDateString(
        "en-US",
        {
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      );
    }

    /* WINDOW CONTROLS */

    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function prepareWindowForDragging() {
      const rect = luckyWindow.getBoundingClientRect();
      luckyWindow.style.left = rect.left + "px";
      luckyWindow.style.top = rect.top + "px";
      luckyWindow.style.transform = "none";
    }

    function startDrag(event) {
      if (event.target.closest(".window-button")) return;

      prepareWindowForDragging();

      const rect = luckyWindow.getBoundingClientRect();

      isDragging = true;
      dragOffsetX = event.clientX - rect.left;
      dragOffsetY = event.clientY - rect.top;

      dragHandle.setPointerCapture(event.pointerId);
      event.preventDefault();
    }

    function dragWindow(event) {
      if (!isDragging) return;

      const maxLeft = Math.max(
        0,
        window.innerWidth - luckyWindow.offsetWidth
      );

      const maxTop = Math.max(
        0,
        window.innerHeight - luckyWindow.offsetHeight
      );

      let newLeft = event.clientX - dragOffsetX;
      let newTop = event.clientY - dragOffsetY;

      newLeft = Math.min(Math.max(0, newLeft), maxLeft);
      newTop = Math.min(Math.max(0, newTop), maxTop);

      luckyWindow.style.left = newLeft + "px";
      luckyWindow.style.top = newTop + "px";
    }

    function stopDrag(event) {
      if (!isDragging) return;

      isDragging = false;

      if (dragHandle.hasPointerCapture(event.pointerId)) {
        dragHandle.releasePointerCapture(event.pointerId);
      }
    }

    function toggleMinimize() {
      const minimized =
        luckyWindow.classList.toggle("minimized");

      minimizeButton.textContent =
        minimized ? "□" : "_";
    }

    function closeWindow() {
      luckyWindow.classList.add("hidden");
      reopenButton.classList.remove("hidden");
    }

    function reopenWindow() {
      luckyWindow.classList.remove("hidden");
      reopenButton.classList.add("hidden");
    }

    function keepWindowOnScreen() {
      if (luckyWindow.classList.contains("hidden")) return;

      const rect = luckyWindow.getBoundingClientRect();

      if (luckyWindow.style.transform !== "none") return;

      const maxLeft = Math.max(
        0,
        window.innerWidth - luckyWindow.offsetWidth
      );

      const maxTop = Math.max(
        0,
        window.innerHeight - luckyWindow.offsetHeight
      );

      luckyWindow.style.left =
        Math.min(Math.max(0, rect.left), maxLeft) + "px";

      luckyWindow.style.top =
        Math.min(Math.max(0, rect.top), maxTop) + "px";
    }

    drawButton.addEventListener("click", drawTask);

    categoryPicker.addEventListener(
      "click",
      event => {
        const button =
          event.target.closest(".category-button");

        if (!button) return;

        const category = button.dataset.category;
        setSelectedCategory(category);

        const cached = categoryStates[category];

        if (!cached) {
          checkCategory(category, true);
          return;
        }

        if (cached.status === "drawn" || cached.status === "already_drawn") {
          showWinner(cached);
        } else if (cached.status === "ready") {
          showReadyState(cached);
        } else if (cached.status === "empty") {
          showEmptyState(cached);
        } else {
          checkCategory(category, true);
        }
      }
    );

    dragHandle.addEventListener("pointerdown", startDrag);
    dragHandle.addEventListener("pointermove", dragWindow);
    dragHandle.addEventListener("pointerup", stopDrag);
    dragHandle.addEventListener("pointercancel", stopDrag);

    minimizeButton.addEventListener("click", toggleMinimize);
    closeButton.addEventListener("click", closeWindow);
    reopenButton.addEventListener("click", reopenWindow);

    window.addEventListener("resize", keepWindowOnScreen);

    checkAllCategories();

  </script>

</body>
</html>
